<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F7EFDC">
<title>Good dig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px;background:#EDE6D6;
 font-family:'Grandstander',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:430px}
@keyframes pop{0%{transform:scale(.5) rotate(-12deg)}55%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes dug{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
@keyframes ringOut{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.5);opacity:0}}
@keyframes lastGlow{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,193,60,0)}50%{box-shadow:inset 0 0 28px 7px rgba(255,193,60,.5)}}
@keyframes confFall{0%{transform:translate(0,-14px) rotate(0);opacity:1}100%{transform:translate(var(--dx),380px) rotate(var(--rot));opacity:0}}
@keyframes slotIn{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes cardIn{0%{opacity:0;transform:scale(.9) translateY(12px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes statIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes starIn{0%{opacity:0;transform:scale(.2) rotate(-45deg)}60%{transform:scale(1.45) rotate(12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}
@keyframes scrabble{0%,100%{transform:translateY(0)}25%{transform:translateY(-6px) rotate(-8deg)}50%{transform:translateY(1px)}75%{transform:translateY(-5px) rotate(7deg)}}
@keyframes lean{0%,100%{transform:rotate(0)}30%{transform:rotate(10deg) translateY(3px)}70%{transform:rotate(7deg) translateY(2px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.12,.86)}55%{transform:translateY(-18px) scale(.92,1.11)}80%{transform:translateY(0) scale(1.09,.91)}}
@keyframes clodFly{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(.55);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes heartBreak{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-10deg)}100%{transform:scale(.85)}}
@keyframes minusUp{0%{transform:translateY(0) scale(.7);opacity:0}25%{transform:translateY(-6px) scale(1.2);opacity:1}100%{transform:translateY(-28px) scale(1);opacity:0}}
@keyframes floatPts{0%{transform:translateY(0) scale(.6);opacity:0}14%{transform:translateY(-8px) scale(1.22);opacity:1}
 26%{transform:translateY(-12px) scale(1)}62%{transform:translateY(-20px) scale(1);opacity:1}100%{transform:translateY(-48px) scale(.96);opacity:0}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(24px)}}
@keyframes leafFall{0%{transform:translate(0,-8px) rotate(0);opacity:0}15%{opacity:.95}100%{transform:translate(var(--lx),126px) rotate(var(--lr));opacity:0}}
@keyframes snowFall{0%{transform:translate(0,-8px);opacity:0}12%{opacity:.95}100%{transform:translate(var(--lx),126px);opacity:.2}}
@keyframes shoutIn{0%{transform:translate(-50%,-50%) scale(.25) rotate(-16deg);opacity:0}
 22%{transform:translate(-50%,-50%) scale(1.22) rotate(5deg);opacity:1}42%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
 72%{transform:translate(-50%,-50%) scale(1.02) rotate(0);opacity:1}100%{transform:translate(-50%,-90%) scale(1.06);opacity:0}}
@keyframes hintIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes hintOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1.3)}}
@keyframes pointPulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(90,190,255,0)}50%{box-shadow:inset 0 0 0 3px rgba(70,175,255,.95),0 0 12px 3px rgba(70,175,255,.5)}}
@keyframes sheen{0%{transform:translateX(-130%) skewX(-18deg)}55%,100%{transform:translateX(230%) skewX(-18deg)}}
@keyframes sparkle{0%{transform:scale(0) rotate(0);opacity:0}25%{transform:scale(1) rotate(30deg);opacity:1}100%{transform:scale(0) rotate(80deg);opacity:0}}
@keyframes goldGlow{0%,100%{box-shadow:0 4px 0 #D99A17,0 6px 12px rgba(150,100,10,.3),0 0 0 0 rgba(255,201,60,0)}50%{box-shadow:0 4px 0 #D99A17,0 6px 12px rgba(150,100,10,.3),0 0 20px 5px rgba(255,201,60,.45)}}
@keyframes blueGlow{0%,100%{box-shadow:0 4px 0 #3E8FBE,0 7px 16px rgba(20,80,120,.34),0 0 0 0 rgba(120,214,255,0)}50%{box-shadow:0 4px 0 #3E8FBE,0 7px 16px rgba(20,80,120,.34),0 0 22px 7px rgba(120,214,255,.6)}}
@keyframes starShine{0%,72%,100%{opacity:0}80%{opacity:.9}88%{opacity:0}}
@keyframes barFill{0%{width:0}100%{width:var(--w)}}
@keyframes sniffIn{0%{opacity:0;transform:translate(-50%,-38%) scale(.75)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tile{position:relative;aspect-ratio:1;border:none;padding:0;display:flex;align-items:center;justify-content:center;
 font:inherit;font-weight:700;cursor:pointer;overflow:visible;touch-action:none;user-select:none;
 transition:transform .12s ease,box-shadow .18s ease,background .18s ease}
.tile .inner{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:inherit}
.grass{border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.hole{border-radius:8px;box-shadow:inset 0 6px 9px rgba(40,24,6,.58),inset 0 -2px 3px rgba(255,236,200,.2),inset 0 0 0 1px rgba(40,24,6,.18)}
.gold{border-radius:8px;box-shadow:inset 0 5px 8px rgba(140,86,6,.4),inset 0 0 0 1px rgba(160,105,10,.32)}
.toyTile{border-radius:8px;box-shadow:inset 0 5px 8px rgba(150,40,80,.32),inset 0 0 0 1px rgba(190,60,110,.38)}
.goldTile{border-radius:8px;box-shadow:inset 0 5px 10px rgba(150,105,0,.4),inset 0 0 0 2px rgba(255,214,90,.75),0 0 14px 2px rgba(255,201,60,.5)}
.fossTile{border-radius:8px;box-shadow:inset 0 5px 10px rgba(60,80,110,.4),inset 0 0 0 2px rgba(160,205,235,.8),0 0 16px 3px rgba(120,190,235,.55)}
.tile.holding{transform:scale(1.12);z-index:5}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(rgba(255,240,190,.95),rgba(255,201,60,.95));pointer-events:none}
.tile .lbl{position:relative;display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 2px 2px rgba(30,16,2,.6))}
.tile.point{animation:pointPulse 1s ease-in-out infinite}
.tile:focus-visible{outline:3px solid #2F7DD1;outline-offset:2px}
.a-pop{animation:pop .44s cubic-bezier(.34,1.6,.64,1)}
.a-dug{animation:dug .2s ease-out}
.a-shake{animation:shakeX .45s ease-in-out}
.burst{position:absolute;inset:0;border-radius:8px;border:3px solid #FFC13C;pointer-events:none;animation:ringOut .55s ease-out forwards}
.last{animation:lastGlow 1.25s ease-in-out infinite}
.conf{position:absolute;width:9px;height:12px;border-radius:3px;animation:confFall 1.8s ease-in forwards;pointer-events:none}
.clod{position:absolute;width:8px;height:7px;border-radius:50%;animation:clodFly .62s ease-out forwards;pointer-events:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.slotfill{animation:slotIn .42s cubic-bezier(.34,1.6,.64,1)}
.brk{animation:heartBreak .5s ease-out}
.bigbtn{position:relative;overflow:hidden;font-family:inherit;padding:12px 26px;font-size:15.5px;font-weight:700;
 border-radius:26px;border:none;color:#4A2A08;cursor:pointer;animation:goldGlow 2.4s ease-in-out infinite}
.bigbtn::after{content:'';position:absolute;top:-40%;bottom:-40%;left:0;width:38%;pointer-events:none;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:sheen 2.4s ease-in-out infinite}
.bigbtn:active{transform:translateY(3px)}
.spk{position:absolute;pointer-events:none;animation:sparkle 1.1s ease-out infinite}
#dog{position:absolute;pointer-events:none;z-index:3;transition:left .3s cubic-bezier(.34,1.3,.64,1),top .3s cubic-bezier(.34,1.3,.64,1);
 animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 4px rgba(50,38,15,.35))}
#dog .tail{transform-origin:88% 62%;animation:wag 1.05s ease-in-out infinite}
#dog.fast .tail{animation-duration:.4s}
#dog .paws{transform-origin:50% 20%}
#dog.digging{animation:lean .34s ease-in-out}
#dog.digging .paws{animation:scrabble .16s linear 3}
#dog.jump{animation:hop .55s ease-out}
.minus{position:absolute;right:0;top:-2px;font-size:16px;font-weight:800;color:#E4574C;animation:minusUp .95s ease-out forwards;pointer-events:none}
.floater{position:absolute;font-size:18px;font-weight:800;letter-spacing:-.01em;-webkit-text-stroke:4px rgba(48,26,4,.72);
 paint-order:stroke fill;animation:floatPts 1.9s cubic-bezier(.2,.9,.3,1) forwards;pointer-events:none;z-index:5}
.cloudy{animation:drift 10s ease-in-out infinite alternate}
.leafp{position:absolute;pointer-events:none;animation:leafFall 7s linear infinite}
.snowp{position:absolute;pointer-events:none;animation:snowFall 8s linear infinite}
.shout{position:absolute;left:50%;top:44%;z-index:6;pointer-events:none;white-space:nowrap;font-size:30px;font-weight:800;
 letter-spacing:-.01em;color:#FFF6DE;-webkit-text-stroke:6px #8A4B14;paint-order:stroke fill;
 text-shadow:0 5px 0 rgba(110,58,10,.35);animation:shoutIn 1.05s cubic-bezier(.2,1.3,.5,1) forwards}
.starthint{position:absolute;left:50%;top:50%;z-index:4;pointer-events:none;white-space:nowrap;font-size:17px;font-weight:700;
 color:#FFF6DE;-webkit-text-stroke:5px rgba(70,45,15,.75);paint-order:stroke fill;animation:hintIn .5s ease-out both}
.starthint.out{animation:hintOut .45s ease-in forwards}
.sniffwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;animation:sniffIn .42s cubic-bezier(.34,1.5,.64,1) both}
.sniffbtn{position:relative;overflow:hidden;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;
 padding:11px 20px 11px 15px;border-radius:26px;font-size:15px;font-weight:800;color:#093B57;animation:blueGlow 1.9s ease-in-out infinite}
.sniffbtn::after{content:'';position:absolute;top:-40%;bottom:-40%;left:0;width:40%;pointer-events:none;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:sheen 2.1s ease-in-out infinite}
.sniffbtn:active{transform:translateY(3px)}
.chip{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,.66);
 box-shadow:0 1px 2px rgba(60,45,20,.1);font-size:12.5px;font-weight:700;color:#33261A;transition:background .25s ease}
.starwrap{position:relative;display:inline-block}
.starwrap .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);
 -webkit-mask:var(--m);mask:var(--m);animation:starShine 3s ease-in-out infinite}
.smallbtn{font-family:inherit;padding:6px 13px;font-size:12.5px;font-weight:600;border-radius:16px;
 border:1.5px solid rgba(90,70,45,.22);background:rgba(255,255,255,.6);color:#5A4632;cursor:pointer}
.helpbtn{font-family:inherit;width:30px;height:30px;padding:0;font-size:15px;font-weight:800;border-radius:50%;
 border:1.5px solid rgba(90,70,45,.22);background:rgba(255,255,255,.6);color:#5A4632;cursor:pointer;line-height:1}
#help{display:none;position:absolute;inset:0;z-index:12;background:rgba(58,40,18,.42);backdrop-filter:blur(5px);
 -webkit-backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:14px}
#help.on{display:flex}
.helpcard{width:100%;max-width:300px;max-height:100%;overflow-y:auto;background:linear-gradient(#FFFDF7,#FFF4E2);
 border-radius:24px;padding:18px 18px 16px;box-shadow:0 10px 34px rgba(50,34,10,.3);animation:cardIn .4s ease-out}
.helpcard h2{margin:4px 0 2px;font-size:22px;font-weight:800;color:#33261A;letter-spacing:-.02em;text-align:center}
.helpcard .sub{text-align:center;font-size:12.5px;color:#7A6754;margin-bottom:14px}
.step{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
.stepnum{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:13px;font-weight:800;color:#4A2A08;background:linear-gradient(#FFE59C,#FFC64A);box-shadow:0 2px 0 #D99A17}
.step p{margin:0;font-size:13.5px;line-height:1.45;color:#4A3826;font-weight:500}
.step b{font-weight:800;color:#33261A}
.demo{display:flex;gap:4px;margin-top:7px}
.demo span{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;
 font-size:15px;font-weight:800;flex-shrink:0}
.helpnote{background:rgba(255,201,60,.18);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.5;
 color:#5A4632;margin:2px 0 14px}
.helpnote b{color:#8A5A05}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<div id="shell" style="position:relative;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(70,55,25,.14)">
  <div id="scenery" style="position:relative;height:112px;overflow:hidden"></div>
  <div style="position:relative;z-index:1;padding:0 12px 12px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:7px 0 8px">
      <div style="min-width:0">
        <div id="lvl" style="font-size:20px;font-weight:800;color:#33261A;letter-spacing:-.02em;line-height:1.1"></div>
        <div id="sceneName" style="font-size:12.5px;color:#6B5B49;font-weight:600;margin-top:1px"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
        <div id="hearts" style="display:flex;gap:3px;position:relative"></div>
        <div style="display:flex;gap:5px;align-items:center">
          <span class="chip" id="starChip" title="Stars earned"></span>
          <span class="chip" id="ptsChip" title="Total points"></span>
          <button id="mute" style="border:none;background:none;padding:0 0 0 2px;cursor:pointer;font-size:14px;line-height:1;opacity:.5" aria-label="Toggle sound">&#128266;</button>
        </div>
      </div>
    </div>
    <div id="slots" style="display:flex;gap:3px;justify-content:center;margin-bottom:8px;flex-wrap:wrap"></div>
    <div id="wrap" style="position:relative">
      <div id="board" style="display:grid;gap:2px;padding:6px;border-radius:14px" role="grid" aria-label="Digging board"></div>
      <div id="strip" style="position:relative;height:36px;margin-top:-2px;border-radius:0 0 14px 14px;overflow:hidden"></div>
      <div id="dog"></div>
      <div id="dirt" style="position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible"></div>
      <div id="shouts" style="position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px">
      <div id="prog" style="font-size:13.5px;font-weight:700;color:#6B5B49"></div>
      <div style="display:flex;gap:7px;align-items:center">
        <button class="helpbtn" id="helpBtn" title="How to play" aria-label="How to play">?</button>
        <button class="smallbtn" id="seasonBtn" style="padding:6px 10px;font-size:12px" title="Preview seasons">&#127810;</button>
        <button class="smallbtn" id="resetBtn">Restart</button>
      </div>
    </div>
  </div>
  <div id="over" style="display:none;position:absolute;inset:0;background:rgba(255,251,243,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:16px;text-align:center;z-index:8"></div>
  <div id="help" role="dialog" aria-label="How to play"></div>
  <div id="confs" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9"></div>
</div>
<div style="margin-top:12px;font-size:12px;color:#7A6754;line-height:1.7;text-align:center">
  <b style="color:#4A3826">Tap</b> to dig &nbsp;&middot;&nbsp; <b style="color:#4A3826">Hold</b> to claim
  &nbsp;&middot;&nbsp; <span id="clearSave" style="cursor:pointer;text-decoration:underline">reset progress</span>
</div>
</main>
<script src="levels.js"></script>
<script>
(function(){
"use strict";
var LEVELS=window.LEVELS||[];
var LIVES=3,HOLD_MS=430,MOVE_TOL=34,HINT_AFTER=25000,HINT_COST=30;
var BONE_BASE=50,STREAK_STEP=10,STREAK_CAP=40,CHIP_COST=40,HEART_BONUS=60,PERFECT_BONUS=150;
var TOY_BONUS=50,GOLD_BONUS=150,FOSSIL_BONUS=400;
var SAVE_KEY='gooddig.save.v1';
var GOLDG='linear-gradient(#FFE59C,#FFC64A 55%,#F5A81E)';
var BLUEG='linear-gradient(#E4F5FE,#8FD3F4 55%,#5CB9E8)';

/* ---------- progress, kept in the browser ---------- */
var save={level:1,total:0,stars:0,best:{},fossils:0,golds:0,toys:0};
function loadSave(){try{var raw=localStorage.getItem(SAVE_KEY);
 if(raw){var s=JSON.parse(raw);if(s&&typeof s.level==='number'){save=s;save.best=save.best||{};}}}catch(e){}}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- shapes ---------- */
function blob(cx,cy,r,vary,fill,seed,squash){squash=squash||.88;var n=9,pts=[],i;
 for(i=0;i<n;i++){var a=i/n*Math.PI*2,rr=r*(1-vary/2+((Math.sin(seed+i*2.11)+1)/2)*vary);
  pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*squash]);}
 var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
 for(i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n];
  var kx=(p[0]+q[0])/2+((p[0]+q[0])/2-cx)*.22,ky=(p[1]+q[1])/2+((p[1]+q[1])/2-cy)*.22;
  d+=' Q'+kx.toFixed(1)+' '+ky.toFixed(1)+' '+q[0].toFixed(1)+' '+q[1].toFixed(1);}
 return '<path d="'+d+' Z" fill="'+fill+'"/>';}
function tree(x,y,s,F,seed){return '<path d="M'+(x-3.5*s)+' '+(y+30*s)+' q3.5 -16 0 -30 q3.5 -3 7 0 q-3.5 14 0 30 Z" fill="#7A5330"/>'+
 blob(x,y,24*s,.32,F.a,seed)+blob(x-14*s,y+8*s,15*s,.35,F.b,seed+2)+blob(x+15*s,y+7*s,14*s,.3,F.c,seed+4)+blob(x+2*s,y-13*s,13*s,.35,F.d,seed+6);}
function bushy(x,y,s,c1,c2,seed){return blob(x,y,25*s,.28,c1,seed,.62)+blob(x+15*s,y+3*s,16*s,.3,c2,seed+3,.66)+blob(x-16*s,y+4*s,14*s,.3,c2,seed+5,.66);}
function pine(x,top,w,bot,c1,c2){return '<path d="M'+(x-2.6)+' '+bot+' q2.6 -12 0 -24 q2.6 -2 5.2 0 q-2.6 12 0 24 Z" fill="#4A3320"/>'+
 '<path d="M'+x+' '+top+' Q'+(x+w*.42)+' '+(top+(bot-top)*.42)+' '+(x+w)+' '+(bot-24)+' Q'+x+' '+(bot-16)+' '+(x-w)+' '+(bot-24)+' Q'+(x-w*.42)+' '+(top+(bot-top)*.42)+' '+x+' '+top+' Z" fill="'+c1+'"/>'+
 '<path d="M'+x+' '+(top+9)+' Q'+(x+w*.5)+' '+(top+(bot-top)*.6)+' '+(x+w+5)+' '+(bot-10)+' Q'+x+' '+(bot-2)+' '+(x-w-5)+' '+(bot-10)+' Q'+(x-w*.5)+' '+(top+(bot-top)*.6)+' '+x+' '+(top+9)+' Z" fill="'+c2+'"/>';}
function skyRect(a,b){return '<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+a+'"/><stop offset="100%" stop-color="'+b+'"/></linearGradient></defs><rect x="0" y="0" width="380" height="112" fill="url(#sk)"/>';}
function cloud(x,y,s,c,seed){return '<g class="cloudy" style="animation-delay:'+(x%4)+'s">'+blob(x,y,17*s,.22,c,seed,.5)+blob(x-13*s,y+3*s,11*s,.24,c,seed+2,.55)+blob(x+14*s,y+2*s,10*s,.24,c,seed+4,.55)+'</g>';}

function loadLevel(){
 if(level>LEVELS.length)level=LEVELS.length;

 LV.m.forEach(function(m){bones[m]=true;});
 cnt=new Array(N).fill(0);
 var i,s;
 for(i=0;i<N;i++){s=0;nb(i).forEach(function(j){if(bones[j])s++;});cnt[i]=s;}
 st=new Array(N).fill(0);
 lives=LIVES;found=0;chips=0;combo=0;over=false;brokeIdx=-1;
 runScore=0;hintsUsed=0;boneBase=0;streakBonus=0;
 gotToy=false;gotGold=false;gotFossil=false;
 overEl.style.display='none';overEl.innerHTML='';confEl.innerHTML='';dirtEl.innerHTML='';shoutEl.innerHTML='';
 board.classList.remove('last');dropSniff();
 applyScene();lvlEl.textContent='Level '+level;
 board.style.gridTemplateColumns='repeat('+C+',1fr)';
 board.innerHTML='';cells=[];
 var fs=C>=8?16:(C>=7?18:20);
 for(i=0;i<N;i++){var b=document.createElement('button');b.className='tile grass';b.style.fontSize=fs+'px';
  b.setAttribute('aria-label','row '+(((i/C)|0)+1)+' column '+(i%C+1));
  b.innerHTML='<span class="inner"><span class="fill"></span><span class="lbl"></span></span>';
  bind(b,i);board.appendChild(b);cells.push(b);}
 /* the opening patch is part of the level, so everyone starts identically */

 paint();slots();dogEl.classList.remove('fast');setDogMood('idle');

   (i<found?'#FFD98A':'rgba(0,0,0,.09)')+';'+(i<found?'box-shadow:inset 0 2px 0 rgba(255,255,255,.5)':'box-shadow:inset 0 2px 3px rgba(0,0,0,.1)');
  if(i<found)s.innerHTML=boneSVG(12);
  if(anim&&i===found-1)s.className='slotfill';

function paint(flash){var i,h;
 for(i=0;i<N;i++){var e=cells[i],l=e.querySelector('.lbl'),s=st[i];
  var wasPoint=e.classList.contains('point'),wasHold=e.classList.contains('holding');
  e.className='tile';if(wasPoint&&s===0)e.classList.add('point');if(wasHold)e.classList.add('holding');
  if(s===0){e.classList.add('grass');e.style.background=grassTone(i);l.innerHTML='';}
  else if(s===3){
   if(i===LV.f){e.classList.add('fossTile');e.style.background='#D8E9F4';l.innerHTML=fossilSVG(C>=8?18:21);}
   else if(i===LV.g){e.classList.add('goldTile');e.style.background='#FFE39A';l.innerHTML=goldBoneSVG(C>=8?17:20);}
   else if(i===LV.t){e.classList.add('toyTile');e.style.background='#FFC2DC';l.innerHTML=toySVG(C>=8?17:20);}
   else{e.classList.add('gold');e.style.background='#FFD07A';l.innerHTML=boneSVG(C>=8?17:20);}}
  else if(s===4){e.classList.add('hole');e.style.background='#9A5E4A';
   l.innerHTML='<span style="opacity:.55">'+boneSVG(C>=8?17:20,'#D9C9B4','#8E7257')+'</span>';}
  else{e.classList.add('hole');e.style.background=dirtTone(i);
   l.innerHTML=cnt[i]?'<span style="color:'+NUMC[cnt[i]]+'">'+cnt[i]+'</span>':'';}}
 hEl.innerHTML='';
 for(h=0;h<LIVES;h++){var sp=document.createElement('span');sp.innerHTML=heartSVG(h>=lives);
  if(h===brokeIdx)sp.className='brk';hEl.appendChild(sp);}
 if(brokeIdx>=0){var m=document.createElement('span');m.className='minus';m.innerHTML='&minus;1';hEl.appendChild(m);
  (function(node){setTimeout(function(){if(node.parentNode)node.parentNode.removeChild(node);},980);})(m);
  brokeIdx=-1;}
 starChip.innerHTML=starSVG(true,13)+'<span>'+save.stars+'</span>';

 if(flash){ptsChip.style.background=flash==='up'?'#D6F5C8':'#FFD6D2';
  setTimeout(function(){ptsChip.style.background='rgba(255,255,255,.66)';},450);}
 var left=TOTAL-found-chips;
 progEl.innerHTML=left===0?'':(left===1?'<span style="color:#B06A08">One more to go!</span>':left+' to go');
 if(left===1)board.classList.add('last');else board.classList.remove('last');}

function confetti(n,delay){setTimeout(function(){
 var cols=['#FFD98A','#BEDC96','#F0BFAF','#B07B48','#FFC13C','#8FBB63','#FFF0C4','#F2578F'],i;
 for(i=0;i<n;i++){var p=document.createElement('span');p.className='conf';
  p.style.left=(4+Math.random()*92)+'%';p.style.top='-5%';
  p.style.background=cols[(Math.random()*cols.length)|0];
  p.style.setProperty('--dx',((Math.random()*110)-55)+'px');
  p.style.setProperty('--rot',((Math.random()*760)-380)+'deg');
  p.style.animationDelay=(Math.random()*.4)+'s';
  p.style.animationDuration=(1.3+Math.random()*.8)+'s';confEl.appendChild(p);}},delay||0);}
function shakeBoard(){board.classList.remove('a-shake');void board.offsetWidth;board.classList.add('a-shake');}
function hurt(mood){brokeIdx=lives-1;lives--;combo=0;sHeart();shakeBoard();buzz([16,50,16]);
 if(lives<=0){over=true;for(var i=0;i<N;i++)if(bones[i]&&st[i]!==3)st[i]=4;
  setDogMood('sad');paint();finish(false);}
 else setDogMood(mood);}
function flood(i){var q=[i],t=[];while(q.length){var k=q.pop();if(st[k]!==0)continue;
 st[k]=1;t.push(k);if(cnt[k]===0)nb(k).forEach(function(j){if(st[j]===0)q.push(j);});}return t;}

function dig(i){if(over||st[i]!==0)return;
 clearHint();dropSniff();moveDogTo(i);dogDig();
 if(bones[i]){st[i]=4;chips++;runScore-=CHIP_COST;
  clods(i,7,'#C9A87C');sChip();floatPts(i,'\u2212'+CHIP_COST,'#FFC9C2');
  shout('Oops!','#9A3B2A');hurt('ouch');paint('down');slots();
  cells[i].querySelector('.lbl').classList.add('a-pop');restDog();armIdle();check();return;}
 var t=flood(i);paint();clods(i,t.length>3?10:6);
 t.forEach(function(k,n){cells[k].classList.remove('a-dug');void cells[k].offsetWidth;
  setTimeout(function(){cells[k].classList.add('a-dug');},Math.min(n*13,130));});
 if(t.length>5){sClear(t.length);shout('Big patch!','#3F6B2A');}
 else if(t.length>3)sClear(t.length);else sDig();
 setDogMood('idle');restDog();armIdle();check();}

function claim(i){if(over||st[i]!==0)return;
 clearHint();dropSniff();moveDogTo(i);
 if(bones[i]){
  st[i]=3;found++;combo++;buzz(18);
  var isFoss=(i===LV.f),isGold=(i===LV.g),isToy=(i===LV.t);
  var bonus=Math.min((combo-1)*STREAK_STEP,STREAK_CAP);
  var extra=isFoss?FOSSIL_BONUS:(isGold?GOLD_BONUS:(isToy?TOY_BONUS:0));
  var pts=BONE_BASE+bonus+extra;
  boneBase+=BONE_BASE;streakBonus+=bonus;runScore+=pts;
  if(isFoss){gotFossil=true;save.fossils=(save.fossils||0)+1;}
  else if(isGold){gotGold=true;save.golds=(save.golds||0)+1;}
  else if(isToy){gotToy=true;save.toys=(save.toys||0)+1;}
  paint('up');slots(true);dogJump();
  clods(i,isFoss?14:9,isFoss?'#A9CFE6':(isGold?'#FFD54A':(isToy?'#F2578F':'#FFD98A')));
  floatPts(i,'+'+pts,isFoss?'#CDE9F8':(isGold?'#FFE9A8':(isToy?'#FFD3E6':'#FFEDAE')));
  cells[i].querySelector('.lbl').classList.add('a-pop');
  var b=document.createElement('span');b.className='burst';
  if(isFoss)b.style.borderColor='#7FBEE3';else if(isGold)b.style.borderColor='#FFC93C';else if(isToy)b.style.borderColor='#F2578F';
  cells[i].appendChild(b);setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},580);
  if(isFoss){sFossil();confetti(30,0);confetti(22,500);}
  else if(isGold){sGold();confetti(16,0);}
  else if(isToy)sSqueak();
  else sBone(Math.min(combo-1,4));
  setDogMood('happy');
  var left=TOTAL-found-chips;
  if(isFoss)shout('A FOSSIL!','#1D5C80',true);
  else if(isGold)shout('Golden bone!','#8A5A05');
  else if(isToy)shout('Squeak!','#A81E56');
  else if(left===1)shout('One more!','#B06A08');
  else if(left>0)shout(SHOUTS[Math.min(combo-1,SHOUTS.length-1)]);
 } else {
  st[i]=1;runScore-=CHIP_COST;floatPts(i,'\u2212'+CHIP_COST,'#FFC9C2');
  dogDig();sWrong();shout('Just dirt!','#9A3B2A');hurt('ouch');paint('down');}
 paint();restDog(1000);armIdle();check();}

function victoryLap(perfect){var spots=[],i,h;
 for(i=0;i<N;i++)if(st[i]===3)spots.push(i);
 if(!spots.length)for(i=0;i<N;i++)spots.push(i);
 var hops=perfect?5:3;
 for(h=0;h<hops;h++)(function(n){setTimeout(function(){
  var k=spots[(Math.random()*spots.length)|0];
  moveDogTo(k);dogJump();clods(k,5,'#FFD98A');sYip(0);},380+n*430);})(h);}

function finish(won){
 clearTimeout(idleTimer);dropSniff();
 var perfect=won&&chips===0&&lives===LIVES&&hintsUsed===0;
 var stars=won?(perfect?3:(lives>=2&&chips<=1?2:1)):0;
 var heartBonus=won?lives*HEART_BONUS:0,perfBonus=perfect?PERFECT_BONUS:0;
 if(won)runScore+=heartBonus+perfBonus;
 if(runScore<0)runScore=0;
 if(won){setDogMood('happy');dogEl.classList.add('fast');
  shout(perfect?'PERFECT DIG!':'Every bone!','#B06A08');
  if(perfect){sPerfect();confetti(32,0);confetti(28,600);confetti(30,1250);confetti(24,1950);}
  else{sWin();confetti(28,0);confetti(22,700);confetti(18,1400);}
  victoryLap(perfect);}
 var wait=won?(perfect?2900:2300):750;
 setTimeout(function(){
  var nx=nextSceneAt(level),bar='',s;
  if(won&&nx){var startL=chapterStart(level),span=nx.from-startL,done=(level+1)-startL;
   var pct=Math.max(5,Math.min(100,Math.round(done/span*100)));
   bar='<div style="background:rgba(0,0,0,.04);border-radius:14px;padding:10px 12px;margin-bottom:13px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
    '<span style="font-size:11px;color:#8A7660;letter-spacing:.03em">UP NEXT</span>'+
    '<span style="font-size:13.5px;font-weight:700;color:#3A2415">'+nx.name+'</span></div>'+
    '<div style="height:9px;border-radius:6px;background:rgba(0,0,0,.1);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.13)">'+
    '<div style="--w:'+pct+'%;width:'+pct+'%;height:100%;border-radius:6px;background:linear-gradient(90deg,#FFD86B,#F5A81E);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);animation:barFill .7s ease-out .3s both"></div></div>'+
    '<div style="font-size:11.5px;color:#8A7660;margin-top:5px;text-align:right">'+done+' of '+span+' levels</div></div>';}
  var prevBest=save.best[level]||0;
  var isBest=won&&runScore>prevBest;
  overEl.style.display='flex';
  var row=function(l,v,d,c){return '<div style="display:flex;justify-content:space-between;font-size:13px;color:#6B5946;padding:3px 0;animation:statIn .3s ease-out '+d+'s both"><span>'+l+'</span><b style="font-weight:700;color:'+(c||'#3A2415')+'">'+v+'</b></div>';};
  var starRow='';
  for(s=0;s<3;s++)starRow+='<span style="display:inline-block;animation:starIn .45s cubic-bezier(.34,1.6,.64,1) '+(.15+s*.3)+'s both">'+starSVG(s<stars,36,true)+'</span>';
  overEl.innerHTML='<div style="animation:cardIn .45s ease-out;max-width:272px;width:100%;background:rgba(255,252,246,.93);border-radius:24px;padding:16px 18px 18px;box-shadow:0 8px 28px rgba(70,50,20,.18)">'+
   '<div style="margin-bottom:2px">'+dogSVG(won?'happy':'sad','ov')+'</div>'+
   '<div id="starRow" style="position:relative;display:flex;gap:5px;justify-content:center;margin-bottom:5px">'+starRow+'</div>'+
   '<div style="font-size:21px;font-weight:800;color:#3A2415;margin-bottom:9px;letter-spacing:-.02em">'+
    (perfect?'Very good dig!':won?'Level '+level+' cleared':'So close!')+'</div>'+
   (won?'<div style="text-align:left;margin-bottom:12px">'+
    row('Bones',found+' &times; '+BONE_BASE,.12)+
    (streakBonus?row('Streak bonus','+'+streakBonus,.2,'#B06A08'):'')+
    (gotToy?row('Squeaky toy','+'+TOY_BONUS,.26,'#C22C68'):'')+
    (gotGold?row('Golden bone','+'+GOLD_BONUS,.28,'#A87407'):'')+
    (gotFossil?row('FOSSIL','+'+FOSSIL_BONUS,.3,'#1D5C80'):'')+
    (chips?row('Chipped',chips+' &times; &minus;'+CHIP_COST,.36,'#C4441F'):'')+
    (hintsUsed?row('Sniffs',hintsUsed+' &times; &minus;'+HINT_COST,.44,'#1C5E86'):'')+
    row('Hearts left',lives+' &times; '+HEART_BONUS,.52)+
    (perfect?row('Perfect dig','+'+PERFECT_BONUS,.6,'#B06A08'):'')+
    '<div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:#3A2415;padding-top:7px;margin-top:4px;border-top:1px solid rgba(0,0,0,.1);animation:statIn .3s ease-out .78s both"><span>Level score</span><span>'+runScore+'</span></div>'+
    (prevBest?'<div style="display:flex;justify-content:space-between;font-size:12px;color:'+(isBest?'#2F7D1F':'#8A7660')+';padding-top:4px;animation:statIn .3s ease-out .86s both"><span>'+(isBest?'New best!':'Your best')+'</span><span>'+Math.max(prevBest,runScore)+'</span></div>':'')+
    '</div>'
    :'<div style="font-size:13.5px;color:#6B5946;margin-bottom:14px">'+found+' of '+TOTAL+' found. Better luck next dig!</div>')+
   bar+
   '<div id="btnWrap" style="position:relative;display:inline-block">'+
   '<button class="bigbtn" id="goBtn" style="background:'+GOLDG+'">'+(won?(level>=LEVELS.length?'Play again':'Next level'):'Try again')+'</button></div></div>';
  if(won){for(s=0;s<stars;s++)sStar(s);
   var srow=document.getElementById('starRow');
   setTimeout(function(){sparkleField(srow,7,srow.offsetWidth,srow.offsetHeight);},700);}
  var bw=document.getElementById('btnWrap');
  setTimeout(function(){sparkleField(bw,5,bw.offsetWidth,bw.offsetHeight);},300);

  if(won){
   save.total+=runScore;
   if(stars>(save.best[level+'s']||0)){save.stars+=stars-(save.best[level+'s']||0);save.best[level+'s']=stars;}
   if(runScore>prevBest)save.best[level]=runScore;
   if(level+1>save.level&&level<LEVELS.length)save.level=level+1;
   writeSave();}

  document.getElementById('goBtn').addEventListener('click',function(){
   if(won&&level<LEVELS.length)level++;
   loadLevel();paint();});},wait);}

function check(){if(over)return;
 var left=0,i;for(i=0;i<N;i++)if(bones[i]&&st[i]!==3&&st[i]!==4)left++;
 if(left===0){over=true;finish(true);}}

/* pointer capture plus a movement tolerance: without both, a thumb
   drifting a few px off the tile cancelled the hold, which felt broken */
function bind(el,i){
 var downAt=0,timer=null,claimed=false,live=false,sx=0,sy=0,pid=null;
 var fill=el.querySelector('.fill');
 function stopHold(){live=false;clearTimeout(timer);el.classList.remove('holding');
  fill.style.transition='height 120ms ease';fill.style.height='0';}
 function onDown(ev){if(over||st[i]!==0)return;ev.preventDefault();ac();
  claimed=false;live=true;downAt=Date.now();sx=ev.clientX;sy=ev.clientY;pid=ev.pointerId;
  try{el.setPointerCapture(pid);}catch(e){}
  clearTimeout(restTimer);moveDogTo(i);el.classList.add('holding');
  fill.style.transition='none';fill.style.height='0';
  requestAnimationFrame(function(){if(!live)return;
   fill.style.transition='height '+HOLD_MS+'ms linear';fill.style.height='100%';});
  timer=setTimeout(function(){if(!live)return;claimed=true;stopHold();claim(i);},HOLD_MS);}
 function onMove(ev){if(!downAt||claimed)return;
  var dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(dx*dx+dy*dy>MOVE_TOL*MOVE_TOL){downAt=0;stopHold();restDog(400);}}
 function onUp(ev){if(over)return;ev.preventDefault();
  try{if(pid!==null)el.releasePointerCapture(pid);}catch(e){}
  if(!downAt){claimed=false;el.classList.remove('holding');return;}
  downAt=0;if(claimed){claimed=false;return;}
  stopHold();dig(i);}
 function onCancel(){if(!downAt)return;downAt=0;claimed=false;stopHold();restDog(400);}
 el.addEventListener('pointerdown',onDown);
 el.addEventListener('pointermove',onMove);
 el.addEventListener('pointerup',onUp);
 el.addEventListener('pointercancel',onCancel);
 el.addEventListener('contextmenu',function(e){e.preventDefault();});
 el.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();dig(i);}
  if(e.key===' '){e.preventDefault();claim(i);}});}

function tileDemo(bg,inner,cls){return '<span class="'+(cls||'')+'" style="background:'+bg+'">'+(inner||'')+'</span>';}
function buildHelp(){
 var el=document.getElementById('help');
 el.innerHTML='<div class="helpcard">'+
  '<div style="text-align:center">'+dogSVG('happy','hp')+'</div>'+
  '<h2>How to play</h2>'+
  '<div class="sub">You are a dog. There are bones buried in the yard. Find them all.</div>'+

  '<div class="step"><span class="stepnum">1</span><div><p>'+
  '<b>Tap green grass to dig it.</b> It turns into a hole.</p>'+
  '<div class="demo">'+tileDemo('#B6D88E','','grass')+
  '<span style="align-self:center;color:#9A8873;font-size:16px;width:auto">&rarr;</span>'+
  tileDemo('#8A5F36','','hole')+'</div></div></div>'+

  '<div class="step"><span class="stepnum">2</span><div><p>'+
  '<b>The number counts bones touching that hole</b> &mdash; all 8 squares around it. '+
  'A blank hole means none nearby, so everything beside it is safe.</p>'+
  '<div class="demo">'+
  tileDemo('#8A5F36','<span style="color:#C4F58C">1</span>','hole')+
  tileDemo('#835932','<span style="color:#FFD955">2</span>','hole')+
  tileDemo('#8A5F36','<span style="color:#FFA98A">3</span>','hole')+
  '</div></div></div>'+

  '<div class="step"><span class="stepnum">3</span><div><p>'+
  '<b>Press and hold</b> a square you think hides a bone. It fills up gold, then the bone is yours.</p>'+
  '<div class="demo">'+tileDemo('#B6D88E','','grass')+
  '<span style="align-self:center;color:#9A8873;font-size:16px;width:auto">&rarr;</span>'+
  tileDemo('#FFD07A',boneSVG(18),'gold')+'</div></div></div>'+

  '<div class="step"><span class="stepnum">4</span><div><p>'+
  '<b>Two ways to lose a heart:</b> digging a square that had a bone (your shovel chips it), '+
  'or holding a square that was only dirt. You get three.</p></div></div>'+

  '<div class="step"><span class="stepnum">5</span><div><p>'+
  '<b>You win when every bone is claimed.</b> Three stars means all hearts, nothing chipped, no hints.</p></div></div>'+

  '<div class="helpnote">Every board can be solved by thinking &mdash; '+
  '<b>you never have to guess.</b> Start from the blank areas and work outward. '+
  'A <b>1</b> touching only one unopened square means that square is the bone.</div>'+

  '<div class="helpnote" style="background:rgba(143,211,244,.22)">Stuck? Wait a few seconds and a blue '+
  '<b style="color:#1C5E86">Sniff it out</b> button appears. The dog points at a square for you &mdash; costs some points.</div>'+

  '<div style="text-align:center"><button class="bigbtn" id="helpGo" style="background:'+GOLDG+'">Got it</button></div>'+
  '</div>';
 document.getElementById('helpGo').addEventListener('click',closeHelp);}
function openHelp(){buildHelp();document.getElementById('help').classList.add('on');clearTimeout(idleTimer);}
function closeHelp(){document.getElementById('help').classList.remove('on');armIdle();}
document.getElementById('helpBtn').addEventListener('click',openHelp);
document.getElementById('help').addEventListener('click',function(e){if(e.target===this)closeHelp();});

document.getElementById('resetBtn').addEventListener('click',function(){loadLevel();paint();});
document.getElementById('seasonBtn').addEventListener('click',function(){
 seasonIdx=(seasonIdx+1)%SEASONS.length;
 var icons={auto:'\uD83C\uDF42',autumn:'\uD83C\uDF41',halloween:'\uD83C\uDF83',winter:'\u2744\uFE0F',plain:'\uD83C\uDF3F'};
 this.textContent=icons[SEASONS[seasonIdx]];
 applyScene();setDogMood(dogMood);paint();});
document.getElementById('clearSave').addEventListener('click',function(){
 if(!confirm('Start over from level 1? Your points and stars will be cleared.'))return;
 try{localStorage.removeItem(SAVE_KEY);}catch(e){}
 save={level:1,total:0,stars:0,best:{},fossils:0,golds:0,toys:0};
 level=1;loadLevel();paint();});

if(!LEVELS.length){
 document.body.innerHTML='<div style="font-family:system-ui;padding:24px;max-width:400px">'+
  '<b>levels.js did not load.</b><br><br>Keep index.html and levels.js in the same folder.</div>';
} else {
 loadSave();
 level=Math.min(save.level||1,LEVELS.length);
 loadLevel();paint();
 /* first ever visit: explain the game before they poke at it */
 if(!save.seenHelp){save.seenHelp=true;writeSave();setTimeout(openHelp,450);}
}
})();
</script>
