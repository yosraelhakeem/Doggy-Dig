<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FDF6E7">
<title>Good dig</title>
<style>
:root{
  --grass-a:#BEDC96; --grass-b:#B2D488; --lawn:#8FBB63;
  --dirt-a:#EBD5B2; --dirt-b:#E4CBA4;
  --gold:#FFD98A; --chip:#F0BFAF;
  --ink:#3A2415; --ink-soft:#7A6550;
  --paper:#FFFCF4; --paper-deep:#FDF6E7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:var(--paper-deep);
  color:var(--ink);
  font-family:"Nunito","Quicksand",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  -webkit-tap-highlight-color:transparent;
}
main{width:100%;max-width:420px}
.shell{
  background:linear-gradient(var(--paper),var(--paper-deep));
  border-radius:20px;padding:16px 14px 18px;
  box-shadow:0 2px 20px rgba(80,55,25,.09);
}
.top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.dog{flex-shrink:0;animation:bob 2.6s ease-in-out infinite}
.title{font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.status{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
.hearts{display:flex;gap:3px;flex-shrink:0}
.heart{width:17px;height:17px}
.heart.gone{opacity:.28;filter:grayscale(1)}

#board{
  display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:5px;
  padding:7px;background:var(--lawn);border-radius:15px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.15);
}
.tile{
  position:relative;aspect-ratio:1;border:none;padding:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font:inherit;font-size:17px;font-weight:800;
  cursor:pointer;overflow:hidden;touch-action:none;user-select:none;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
}
.tile:focus-visible{outline:3px solid #4A7BD1;outline-offset:2px}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,255,255,.45);pointer-events:none}
.tile .lbl{position:relative;display:flex;align-items:center;justify-content:center;line-height:1}

.foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:10px}
.tally{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink-soft)}
button.reset{
  font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
  background:#fff;border:1.5px solid #E0D2BC;border-radius:22px;
  padding:9px 16px;cursor:pointer;
}
button.reset:active{transform:translateY(1px)}
button.reset:focus-visible{outline:3px solid #4A7BD1;outline-offset:2px}

.help{margin-top:14px;font-size:12.5px;color:var(--ink-soft);line-height:1.75}
.help b{color:var(--ink);font-weight:800}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes dug{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
.dug{animation:dug .18s ease-out}
.shake{animation:shake .4s ease-in-out}
.burst{position:absolute;inset:0;border-radius:9px;border:3px solid var(--gold);pointer-events:none;animation:ring .5s ease-out forwards}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main>
  <div class="shell">
    <div class="top">
      <div class="dog" id="dog"></div>
      <div style="flex:1;min-width:0">
        <div class="title">Good dig</div>
        <div class="status" id="status">Tap the grass. See what turns up.</div>
      </div>
      <div class="hearts" id="hearts"></div>
    </div>

    <div id="board" role="grid" aria-label="Digging board"></div>

    <div class="foot">
      <div class="tally" id="tally"></div>
      <button class="reset" id="reset">New yard</button>
    </div>
  </div>

  <div class="help">
    <div><b>Tap</b> to dig. Hitting a bone with the shovel chips it.</div>
    <div><b>Hold</b> to claim a bone. A wrong call costs a life.</div>
  </div>
</main>

<script>
(function(){
"use strict";

/* ---- tuning ---------------------------------------------------------- */
var ROWS = 7;
var COLS = 7;          // keep at or below 10 — tiles get too small to hold
var BONES = 8;         // ~16% density. see PROJECT.md for the density table
var HOLD_MS = 550;     // long-press duration to claim a bone
var LIVES = 3;

/* ---- state ----------------------------------------------------------- */
var N = ROWS * COLS;
var bones, counts, state, lives, found, over, started, cells = [];
/* state values: 0 hidden · 1 dug · 3 claimed bone · 4 chipped bone */

var NUM_COLOR = ['','#2F7D1F','#C97A0E','#D1512A','#6B5BD6','#1F6FB5','#B33F63','#5F5E5A','#5F5E5A'];

var board  = document.getElementById('board');
var statusEl = document.getElementById('status');
var heartsEl = document.getElementById('hearts');
var tallyEl  = document.getElementById('tally');
var dogEl    = document.getElementById('dog');

board.style.setProperty('--cols', COLS);

/* ---- artwork (placeholder — swap for real assets) -------------------- */
function boneSVG(size){
  return '<svg width="'+size+'" height="'+(size*0.85)+'" viewBox="0 0 26 22" aria-hidden="true">'+
    '<g fill="#FFFBF2" stroke="#C9A87C" stroke-width="1.4" stroke-linejoin="round">'+
    '<circle cx="6" cy="7" r="4.4"/><circle cx="6" cy="15" r="4.4"/>'+
    '<circle cx="20" cy="7" r="4.4"/><circle cx="20" cy="15" r="4.4"/>'+
    '<rect x="5" y="7" width="16" height="8" rx="3"/></g>'+
    '<g fill="#FFFBF2"><circle cx="6" cy="7" r="3.6"/><circle cx="6" cy="15" r="3.6"/>'+
    '<circle cx="20" cy="7" r="3.6"/><circle cx="20" cy="15" r="3.6"/>'+
    '<rect x="5" y="7.6" width="16" height="6.8" rx="3"/></g></svg>';
}

function heartSVG(gone){
  return '<svg class="heart'+(gone?' gone':'')+'" viewBox="0 0 24 22" aria-hidden="true">'+
    '<path d="M12 21C6 16.5 2 13 2 8.5 2 5.4 4.4 3 7.5 3c1.9 0 3.6 1 4.5 2.4C12.9 4 14.6 3 16.5 3 19.6 3 22 5.4 22 8.5 22 13 18 16.5 12 21z" fill="#E4574C"/></svg>';
}

function dogSVG(mood){
  var eyes, mouth = '', extra = '';
  if (mood === 'happy') {
    eyes = '<path d="M22 25 q3.5 -4.5 7 0" stroke="#3A2415" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
           '<path d="M35 25 q3.5 -4.5 7 0" stroke="#3A2415" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    extra = '<ellipse cx="32" cy="41" rx="4" ry="5" fill="#E88B8B"/>';
  } else if (mood === 'ouch') {
    eyes = '<path d="M22 22 l7 6 M29 22 l-7 6" stroke="#3A2415" stroke-width="2.2" stroke-linecap="round"/>'+
           '<path d="M35 22 l7 6 M42 22 l-7 6" stroke="#3A2415" stroke-width="2.2" stroke-linecap="round"/>';
  } else if (mood === 'sad') {
    eyes = '<circle cx="25" cy="26" r="2.6" fill="#3A2415"/><circle cx="39" cy="26" r="2.6" fill="#3A2415"/>'+
           '<path d="M20 20 q5 -2 9 1 M44 20 q-5 -2 -9 1" stroke="#3A2415" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    mouth = '<path d="M27 41 q5 -4 10 0" stroke="#3A2415" stroke-width="2" fill="none" stroke-linecap="round"/>';
  } else {
    eyes = '<circle cx="25" cy="25" r="2.8" fill="#3A2415"/><circle cx="39" cy="25" r="2.8" fill="#3A2415"/>'+
           '<circle cx="26" cy="24" r="1" fill="#fff"/><circle cx="40" cy="24" r="1" fill="#fff"/>';
    mouth = '<path d="M27 39 q5 3 10 0" stroke="#3A2415" stroke-width="2" fill="none" stroke-linecap="round"/>';
  }
  return '<svg width="54" height="50" viewBox="0 0 64 56" aria-hidden="true">'+
    '<ellipse cx="13" cy="26" rx="8" ry="15" fill="#8A5A32"/>'+
    '<ellipse cx="51" cy="26" rx="8" ry="15" fill="#8A5A32"/>'+
    '<ellipse cx="32" cy="28" rx="20.5" ry="19" fill="#B07B48"/>'+
    '<ellipse cx="32" cy="37" rx="12.5" ry="9.5" fill="#EBD5B2"/>'+
    extra +
    '<ellipse cx="32" cy="32" rx="4.2" ry="3.2" fill="#3A2415"/>'+
    mouth + eyes + '</svg>';
}

/* ---- board ----------------------------------------------------------- */
function neighbours(i){
  var r = Math.floor(i/COLS), c = i % COLS, out = [];
  for (var dr=-1; dr<2; dr++) for (var dc=-1; dc<2; dc++){
    if (!dr && !dc) continue;
    var nr = r+dr, nc = c+dc;
    if (nr>=0 && nr<ROWS && nc>=0 && nc<COLS) out.push(nr*COLS+nc);
  }
  return out;
}

function recount(){
  counts = new Array(N).fill(0);
  for (var i=0; i<N; i++){
    var s = 0;
    neighbours(i).forEach(function(j){ if (bones[j]) s++; });
    counts[i] = s;
  }
}

/* TODO: run a deduction solver here and regenerate any board that forces
   a guess. This is the single most important thing left to build — a
   guess that costs a life is the main reason people quit puzzles. */
function generate(){
  bones = new Array(N).fill(false);
  state = new Array(N).fill(0);
  var placed = 0;
  while (placed < BONES){
    var k = Math.floor(Math.random()*N);
    if (!bones[k]){ bones[k] = true; placed++; }
  }
  recount();
  lives = LIVES; found = 0; over = false; started = false;
}

function build(){
  board.innerHTML = ''; cells = [];
  for (var i=0; i<N; i++){
    var b = document.createElement('button');
    b.className = 'tile';
    b.setAttribute('aria-label', 'row '+(Math.floor(i/COLS)+1)+' column '+(i%COLS+1));
    b.innerHTML = '<span class="fill"></span><span class="lbl"></span>';
    bindTile(b, i);
    board.appendChild(b);
    cells.push(b);
  }
}

function checker(i){ var r = Math.floor(i/COLS), c = i % COLS; return (r+c) % 2 === 0; }

function paint(){
  for (var i=0; i<N; i++){
    var el = cells[i], lbl = el.querySelector('.lbl'), s = state[i];
    if (s === 0){
      el.style.background = checker(i) ? 'var(--grass-a)' : 'var(--grass-b)';
      lbl.innerHTML = '';
    } else if (s === 3){
      el.style.background = 'var(--gold)';
      lbl.innerHTML = boneSVG(21);
    } else if (s === 4){
      el.style.background = 'var(--chip)';
      lbl.innerHTML = '<span style="opacity:.5">'+boneSVG(21)+'</span>';
    } else {
      el.style.background = checker(i) ? 'var(--dirt-a)' : 'var(--dirt-b)';
      lbl.innerHTML = counts[i]
        ? '<span style="color:'+NUM_COLOR[counts[i]]+'">'+counts[i]+'</span>'
        : '';
    }
  }
  heartsEl.innerHTML = '';
  for (var h=0; h<LIVES; h++) heartsEl.innerHTML += heartSVG(h >= lives);
  tallyEl.innerHTML = boneSVG(16) + '<span>' + found + ' of ' + BONES + '</span>';
}

function say(text, mood){
  statusEl.textContent = text;
  if (mood) dogEl.innerHTML = dogSVG(mood);
}

function loseLife(message, mood){
  lives--;
  heartsEl.classList.remove('shake');
  void heartsEl.offsetWidth;
  heartsEl.classList.add('shake');
  if (lives <= 0){
    over = true;
    for (var i=0; i<N; i++) if (bones[i] && state[i] !== 3) state[i] = 4;
    say('All tuckered out. Nap time.', 'sad');
  } else {
    say(message, mood);
  }
}

function flood(i){
  var stack = [i], touched = [];
  while (stack.length){
    var k = stack.pop();
    if (state[k] !== 0) continue;
    state[k] = 1;
    touched.push(k);
    if (counts[k] === 0) neighbours(k).forEach(function(j){ if (state[j] === 0) stack.push(j); });
  }
  return touched;
}

function dig(i){
  if (over || state[i] !== 0) return;

  // first dig is always safe — relocate a bone if needed
  if (!started){
    started = true;
    if (bones[i]){
      bones[i] = false;
      var m;
      do { m = Math.floor(Math.random()*N); } while (bones[m] || m === i);
      bones[m] = true;
      recount();
    }
  }

  if (bones[i]){
    state[i] = 4;
    paint();
    cells[i].querySelector('.lbl').classList.add('pop');
    loseLife('Oof, the shovel chipped that one.', 'ouch');
    paint(); checkWin();
    return;
  }

  var opened = flood(i);
  paint();
  opened.forEach(function(k, n){
    cells[k].classList.remove('dug');
    void cells[k].offsetWidth;
    setTimeout(function(){ cells[k].classList.add('dug'); }, Math.min(n*14, 140));
  });
  say(opened.length > 4 ? 'A whole clear patch.' : 'Dirt. Read the numbers.', 'idle');
  checkWin();
}

function claim(i){
  if (over || state[i] !== 0) return;
  if (bones[i]){
    state[i] = 3; found++;
    paint();
    cells[i].querySelector('.lbl').classList.add('pop');
    var burst = document.createElement('span');
    burst.className = 'burst';
    cells[i].appendChild(burst);
    setTimeout(function(){ if (burst.parentNode) burst.parentNode.removeChild(burst); }, 520);
    say('Bone. Tail wag.', 'happy');
  } else {
    state[i] = 1;
    paint();
    loseLife('Nothing down there. Just dirt.', 'ouch');
  }
  paint(); checkWin();
}

function checkWin(){
  if (over) return;
  var left = 0, chipped = 0;
  for (var i=0; i<N; i++){
    if (bones[i] && state[i] !== 3 && state[i] !== 4) left++;
    if (state[i] === 4) chipped++;
  }
  if (left === 0){
    over = true;
    say(chipped === 0
      ? 'Every bone, not one chipped. Very good dig.'
      : 'All bones found. ' + chipped + ' chipped.', 'happy');
  }
}

/* ---- input ----------------------------------------------------------- */
function bindTile(el, i){
  var downAt = 0, timer = null, claimed = false, live = false;
  var fill = el.querySelector('.fill');

  function stopFill(){
    live = false;
    clearTimeout(timer);
    fill.style.transition = 'height 130ms ease';
    fill.style.height = '0';
  }

  function onDown(ev){
    if (over || state[i] !== 0) return;
    ev.preventDefault();
    claimed = false; live = true; downAt = Date.now();
    fill.style.transition = 'none';
    fill.style.height = '0';
    // guard the rAF: a very fast tap can otherwise start the fill after
    // the cancel has already run, leaving the tile permanently tinted
    requestAnimationFrame(function(){
      if (!live) return;
      fill.style.transition = 'height ' + HOLD_MS + 'ms linear';
      fill.style.height = '100%';
    });
    timer = setTimeout(function(){
      if (!live) return;
      claimed = true; stopFill(); claim(i);
    }, HOLD_MS);
  }

  function onUp(ev){
    if (over || !downAt) return;
    ev.preventDefault();
    downAt = 0;
    if (claimed){ claimed = false; return; }
    stopFill();
    dig(i);
  }

  function onBail(){
    if (!downAt) return;
    downAt = 0; claimed = false; stopFill();
  }

  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointerleave', onBail);
  el.addEventListener('pointercancel', onBail);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  el.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dig(i); }
    if (e.key === 'b' || e.key === 'B'){ e.preventDefault(); claim(i); }
  });
}

document.getElementById('reset').addEventListener('click', function(){
  generate(); paint(); say('Fresh yard. Tap the grass.', 'idle');
});

generate();
build();
dogEl.innerHTML = dogSVG('idle');
paint();
})();
</script>
</body>
</html>
